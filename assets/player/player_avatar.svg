<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Outer Energy Containment Ring -->
  <circle cx="64" cy="64" r="58" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="14 8 6 8" stroke-opacity="0.6"/>
  
  <!-- Outer Armored Hull (Octagonal Bulkhead) -->
  <polygon points="36,16 92,16 112,36 112,92 92,112 36,112 16,92 16,36" fill="#0B1628" stroke="#00E5FF" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Inner Armor Sub-plate -->
  <polygon points="42,26 86,26 102,42 102,86 86,102 42,102 26,86 26,42" fill="#13233D" stroke="#0088AA" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Corner Plasma Thrusters -->
  <rect x="20" y="20" width="12" height="12" rx="3" transform="rotate(45 26 26)" fill="#1A3654" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="26" cy="26" r="3.2" fill="#80FFFF"/>

  <rect x="96" y="20" width="12" height="12" rx="3" transform="rotate(45 102 26)" fill="#1A3654" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="102" cy="26" r="3.2" fill="#80FFFF"/>

  <rect x="96" y="96" width="12" height="12" rx="3" transform="rotate(45 102 102)" fill="#1A3654" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="102" cy="102" r="3.2" fill="#80FFFF"/>

  <rect x="20" y="96" width="12" height="12" rx="3" transform="rotate(45 26 102)" fill="#1A3654" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="26" cy="102" r="3.2" fill="#80FFFF"/>

  <!-- Power Conduits -->
  <line x1="33" y1="33" x2="48" y2="48" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="33" x2="80" y2="48" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="95" x2="80" y2="80" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="95" x2="48" y2="80" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Forward Navigation Crest (North arrow) -->
  <polygon points="64,18 72,28 67,28 64,24 61,28 56,28" fill="#00E5FF"/>

  <!-- Quantum Core Chamber -->
  <circle cx="64" cy="64" r="22" fill="#071322" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="64" cy="64" r="16" fill="#003D52" stroke="#4DF0FF" stroke-width="2"/>

  <!-- Central Quantum Prism Core -->
  <polygon points="64,50 78,64 64,78 50,64" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="64" cy="64" r="6" fill="#FFFFFF"/>

  <!-- Cardinal Telemetry Indicators -->
  <circle cx="64" cy="38" r="2" fill="#80FFFF"/>
  <circle cx="64" cy="90" r="2" fill="#80FFFF"/>
  <circle cx="38" cy="64" r="2" fill="#80FFFF"/>
  <circle cx="90" cy="64" r="2" fill="#80FFFF"/>
</svg>
