<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Deep Space Hull Background -->
  <rect width="124" height="124" x="2" y="2" rx="24" fill="#050914" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.7"/>
  
  <!-- Subtle Tactical Matrix Grid Lines -->
  <line x1="2" y1="32" x2="126" y2="32" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="2" y1="64" x2="126" y2="64" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.2"/>
  <line x1="2" y1="96" x2="126" y2="96" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="32" y1="2" x2="32" y2="126" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15"/>
  <line x1="64" y1="2" x2="64" y2="126" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.2"/>
  <line x1="96" y1="2" x2="96" y2="126" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15"/>

  <!-- Quantum Entanglement Circuit Line -->
  <line x1="42" y1="64" x2="86" y2="64" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6 3"/>
