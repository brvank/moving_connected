  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>

  <!-- Avatar Alpha Drone (Left) -->
  <g transform="translate(42, 64) scale(0.38) translate(-64, -64)">
    <polygon points="36,16 92,16 112,36 112,92 92,112 36,112 16,92 16,36" fill="#0B1628" stroke="#00E5FF" stroke-width="4"/>
    <polygon points="42,26 86,26 102,42 102,86 86,102 42,102 26,86 26,42" fill="#13233D" stroke="#0088AA" stroke-width="2"/>
    <circle cx="64" cy="64" r="20" fill="#003D52" stroke="#00E5FF" stroke-width="3"/>
    <polygon points="64,52 76,64 64,76 52,64" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="64" cy="64" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Avatar Beta Drone (Right) -->
  <g transform="translate(86, 64) scale(0.38) translate(-64, -64)">
    <polygon points="36,16 92,16 112,36 112,92 92,112 36,112 16,92 16,36" fill="#0B1628" stroke="#00E5FF" stroke-width="4"/>
    <polygon points="42,26 86,26 102,42 102,86 86,102 42,102 26,86 26,42" fill="#13233D" stroke="#0088AA" stroke-width="2"/>
